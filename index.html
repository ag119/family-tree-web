<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family Tree</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f5f1; color: #1c1c1c; display: grid; place-items: center; min-height: 100vh;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #14140f; color: #f0f0ea; } }
  .wrap { max-width: 440px; margin: 24px; padding: 32px; }
  .tree { font-size: 3.4rem; }
  h1 { margin: 12px 0 4px; }
  p { line-height: 1.55; opacity: 0.85; }
  a.btn {
    display: inline-block; margin-top: 20px; padding: 14px 22px; border-radius: 12px;
    background: #3b6e58; color: #fff; text-decoration: none; font-weight: 600;
  }
  footer { margin-top: 28px; font-size: 0.8rem; opacity: 0.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tree">🌳</div>
    <h1>Family Tree</h1>
    <p>Build your family tree together. One tap to invite a relative on WhatsApp — they install, land on their spot, and add their side of the family.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.nest.family_tree">Get it on Google Play</a>
    <footer><a href="privacy.html">Privacy Policy</a></footer>
  </div>
</body>
</html>
